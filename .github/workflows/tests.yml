name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                  # report every Python version, not only the first failure
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Test
        run: pytest -q

  # the lowest supported versions (pyproject.toml): Python 3.8, PyTorch 1.13, NumPy 1.21 (and SciPy 1.7 for the tests)
  oldest-dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install
        run: |
          pip install "torch==1.13.1" --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy==1.21.6" "scipy==1.7.3" pytest
      # tests run on the source tree: the build backend (setuptools >= 77) needs Python >= 3.9, while users on
      # Python 3.8 install the pure-Python wheel from PyPI, which needs no build
      - name: Test
        run: PYTHONPATH=$PWD pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/env
          /tmp/env/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/env/bin/pip install dist/*.whl
          cd /tmp && /tmp/env/bin/python -c "import torch_vn_algebra as t; A = t.TypeIAlgebra([2, 3], [2, 3]); print(t.__version__, A.random_unitary_operator(2).matrix.shape)"
