[build-system]
requires = ["setuptools>=77"]                # PEP 639 license metadata (the wheel is pure Python, py3-none-any:
                                             # pip installs it on Python 3.8 without building)
build-backend = "setuptools.build_meta"

[project]
name = "torch_vn_algebra"
dynamic = ["version"]
description = "PyTorch library for block-diagonal matrices with symmetry sectors (Type I von Neumann algebras): Haar random unitaries, quantum states, channels, Lindblad dynamics, spin chains; batched on GPU"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Irina Nikolaeva" }, { name = "Andrej Novikov" }]
requires-python = ">=3.8"
dependencies = ["torch>=1.13", "numpy>=1.21"]   # the whole test suite passes with these minimal versions
keywords = ["von Neumann algebra", "operator algebra", "block-diagonal matrix", "symmetry sectors",
            "superselection sectors", "quantum information", "quantum channels", "Kraus operators", "Choi matrix",
            "density matrix", "quantum entropy", "Renyi divergence", "Lindblad equation", "master equation",
            "open quantum systems", "Haar random unitary", "random matrices", "Weingarten", "spin chains",
            "exact diagonalization", "Lanczos", "SU(2)", "Clebsch-Gordan", "Wedderburn decomposition", "commutant",
            "group representation", "conditional expectation", "Jones index", "Jordan algebra",
            "equivariant neural networks", "pytorch", "gpu", "autograd"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/andre-a-no/von_neumann_type_i"
Documentation = "https://andre-a-no.github.io/von_neumann_type_i/"
Tutorial = "https://andre-a-no.github.io/von_neumann_type_i/tutorial/"
"Lecture notes" = "https://andre-a-no.github.io/von_neumann_type_i/lecture_notes/"
Paper = "https://arxiv.org/abs/2606.15882"
Source = "https://github.com/andre-a-no/von_neumann_type_i"
Issues = "https://github.com/andre-a-no/von_neumann_type_i/issues"
Changelog = "https://github.com/andre-a-no/von_neumann_type_i/blob/main/CHANGELOG.md"

[project.optional-dependencies]
scripts = ["scipy", "pandas", "tqdm", "matplotlib", "seaborn", "mpmath"]
test = ["pytest", "scipy>=1.7", "mpmath", "qutip>=5; python_version >= '3.10'"]   # qutip: interop tests
interop = ["qutip>=5"]                              # interop.to_qutip etc.; dynamiqs (Python >= 3.10) works too

[tool.setuptools]
packages = ["torch_vn_algebra"]

[tool.setuptools.package-data]
torch_vn_algebra = ["guide.md"]   # python -m torch_vn_algebra.guide

[tool.setuptools.dynamic]
version = { attr = "torch_vn_algebra.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
